[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="semantic-hardness-conservation"
version="2.0.0"
description="Reproducible diagnostics for Semantic Hardness Conservation"
requires-python=">=3.10"
dependencies=["numpy>=1.24","pandas>=2.0","matplotlib>=3.7","networkx>=3.0","gradio>=5.0"]
[project.scripts]
semantic-hardness="semantic_hardness.cli:main"
[tool.setuptools.packages.find]
where=["src"]
